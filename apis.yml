name: Tagomi
description: 'Tagomi was an institutional-grade cryptocurrency prime brokerage founded
  in 2018 in New York that offered smart order routing and cross-exchange best-execution
  across 14+ digital-asset venues, a library of advanced trading algorithms, post-trade
  reporting, and one-click settlement and custody for professional and institutional
  investors. Coinbase acquired Tagomi in May 2020 in an all-stock deal (reported at
  roughly $70-100M) and folded it in as the foundation of Coinbase Prime. The tagomi.com
  domain now 301-redirects to Coinbase Prime, and no independent Tagomi API, developer
  portal, or documentation surface remains.'
